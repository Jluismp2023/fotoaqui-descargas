<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Fotos con fecha, día, dirección, coordenadas GPS y un mapa pequeño en el sello.">

<style>

  <a class="pronto" href="https://play.google.com/store/apps/details?id=com.jluismp.fotoaqui">Descárgala en Google Play</a>
